name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas sqlalchemy psycopg2-binary loguru python-dotenv pytest pytest-cov

      - name: Run tests
        env:
          PYTHONPATH: src
        run: |
          pytest tests/ -v